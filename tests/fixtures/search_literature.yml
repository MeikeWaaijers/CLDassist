                  "text": "Research indicates a significant relationship between a family history of substance use disorders (SUDs) and the frequency of substance use in individuals. Studies have found that individuals with a higher density of family members affected by SUDs tend to initiate substance use earlier, escalate usage more rapidly, and engage in prolonged periods of use. For instance, a study analyzing data from over 36,000 adults revealed that each unit increase in weighted family history density was associated with a 0.53-year earlier onset and a 0.48-year longer duration of substance use. ([pmc.ncbi.nlm.nih.gov](https://pmc.ncbi.nlm.nih.gov/articles/PMC12211992/?utm_source=openai))\n\nAdditionally, research has demonstrated that both intergenerational (e.g., parents, grandparents) and intragenerational (e.g., siblings) transmission of addictive behaviors can influence an individual's substance use patterns. Perceptions of family or household members' engagement in gambling, alcohol use, drug use, and other addictive behaviors during youth have been linked to higher frequencies of these behaviors and increased problem severity in adulthood. ([sciencedirect.com](https://www.sciencedirect.com/science/article/pii/S030646032200226X?utm_source=openai))\n\nFurthermore, studies have explored the genetic and environmental mechanisms underlying this relationship. The concept of \"genetic nurture\" suggests that parental genetics can indirectly influence offspring substance use through the rearing environment. For example, a study utilizing polygenic scores found that genetic nurture significantly affects smoking behaviors, accounting for 22\u201326% of direct genetic transmission effects. This influence persists across adulthood, indicating a lasting impact of parental genetics on offspring substance use patterns. ([nature.com](https://www.nature.com/articles/s41467-026-71175-8?utm_source=openai))\n\nIn summary, evidence supports a positive association between a family history of addiction and increased frequency of substance use, influenced by both genetic predispositions and environmental factors within the family setting. "
