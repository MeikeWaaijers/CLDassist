                  "logprobs": [],
                  "text": "Scientific studies have explored the relationship between access to mental health treatment and the frequency of substance use, revealing both direct and indirect associations.\n\n**Direct Associations:**\n\nResearch indicates that timely access to mental health services can lead to a reduction in substance use frequency. A study published in the *Journal of Health Economics* found that reducing wait times for substance use disorder treatment not only decreased the use of treatment services but also improved employment outcomes, suggesting that prompt access to care can mitigate the adverse effects of substance use disorders. ([sciencedirect.com](https://www.sciencedirect.com/science/article/abs/pii/S0167629626000603?utm_source=openai))\n\n**Indirect Associations:**\n\nAccess to mental health treatment is also linked to increased utilization of substance use treatment services. A study in the *International Journal of Environmental Research and Public Health* reported that individuals with substance use disorders who engaged in mental health treatment were more likely to seek substance use treatment, indicating that addressing mental health issues can facilitate engagement in substance use interventions. ([mdpi.com](https://www.mdpi.com/1660-4601/22/4/640?utm_source=openai))\n\n**Barriers to Access:**\n\nConversely, limited access to mental health services can exacerbate substance use. An integrative literature review highlighted that individuals with co-occurring mental health and substance use disorders often face personal and structural barriers to accessing treatment, leading to underutilization of services and potentially higher substance use frequency. ([pmc.ncbi.nlm.nih.gov](https://pmc.ncbi.nlm.nih.gov/articles/PMC4695242/?utm_source=openai))\n\nIn summary, evidence suggests that improved access to mental health treatment is associated with reduced substance use frequency, while barriers to such access can lead to increased substance use. "
