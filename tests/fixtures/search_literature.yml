                  ],
                  "logprobs": [],
                  "text": "Research has extensively examined the relationship between the frequency of substance use and the intensity of peer influence, particularly among adolescents. Findings indicate that peer influence significantly affects adolescent substance use, with both unidirectional and bidirectional relationships observed.\n\n**Unidirectional Influence:**\n\nA meta-analysis by Watts et al. (2023) quantified the effect of peer influence on adolescent substance use. The study found a significant effect size (\u03b2 = .147, p < .001), indicating that adolescents tend to adjust their substance use behaviors to align with their peers' perceived or actual use. This suggests a unidirectional influence where peer behaviors directly impact individual substance use. ([link.springer.com](https://link.springer.com/article/10.1007/s12144-023-04944-z?utm_source=openai))\n\n**Bidirectional Influence:**\n\nLongitudinal studies have demonstrated reciprocal relationships between peer influence and adolescent substance use. For instance, research by Simons-Morton and Chen (2006) showed that initial adolescent substance use predicted an increase in the number of substance-using friends over time (selection effect), while the initial number of substance-using friends predicted substance use progression (socialization effect). This indicates a bidirectional relationship where both peer influence and individual behaviors mutually affect each other. ([sciencedirect.com](https://www.sciencedirect.com/science/article/pii/S0306460305002364?utm_source=openai))\n\n**Moderating Factors:**\n\nThe strength of peer influence on substance use can be moderated by various factors. A systematic scoping review by Rodr\u00edguez-Ruiz and Espejo-Siles (2024) identified elements such as emotional control, closeness to parents, school disapproval of substance use, and sport participation as factors that can attenuate the impact of peer substance use on adolescents. Conversely, factors like avoidant and anxious attachment, sibling's willingness to use substances, school troubles, peer support, or criminogenic settings can increase the likelihood of substance use among adolescents with substance-using peers. ([link.springer.com](https://link.springer.com/article/10.1007/s40894-024-00247-x?utm_source=openai))\n\n**Situational Context:**\n\nThe context in which peer interactions occur also plays a role. Gallupe and Bouchard (2013) found that higher levels of substance use are more likely to occur in smaller group settings, and that the amount friends drink or smoke at parties is strongly related to personal substance use. This suggests that the immediate social environment can influence the intensity of peer influence on substance use. ([sciencedirect.com](https://www.sciencedirect.com/science/article/pii/S0047235213000032?utm_source=openai))\n\nIn summary, scientific literature supports both unidirectional and bidirectional relationships between the frequency of substance use and peer influence intensity. The nature and strength of this relationship are influenced by individual characteristics, contextual factors, and the specific dynamics of peer interactions. "
