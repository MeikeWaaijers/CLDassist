                    }
                  ],
                  "logprobs": [],
                  "text": "Scientific research has extensively examined the relationship between peer influence intensity and the frequency of substance use, particularly among adolescents and young adults. The consensus indicates a significant positive association: as peer influence intensifies, the frequency of substance use tends to increase.\n\nA comprehensive meta-analysis by Watts et al. (2023) synthesized data from 27 longitudinal studies involving over 28,000 adolescents. The findings revealed a significant effect of peer influence on adolescent substance use, with an average effect size of \u03b2 = .147 (p < .001). This suggests that adolescents are likely to adjust their substance use behaviors to align with their peers' perceived or actual use. The study also highlighted that this effect varies depending on the type of substance and whether peer influence is measured through perceived norms or actual peer reports. ([link.springer.com](https://link.springer.com/article/10.1007/s12144-023-04944-z?fromPaywallRec=true&utm_source=openai))\n\nSimilarly, Andrews et al. (2002) conducted a longitudinal study with 294 young adults aged 19 to 25, along with their same- and opposite-gender best friends or mates. The study found consistent similarities over time between individuals and their peers in cigarette use, alcohol consumption, binge drinking, and, in most cases, marijuana use. Prospective analyses indicated that peer use predicted young adults' cigarette use, binge drinking, and problematic substance use, underscoring the significant role of peer influence in young adult substance use behaviors. ([pubmed.ncbi.nlm.nih.gov](https://pubmed.ncbi.nlm.nih.gov/12090677/?utm_source=openai))\n\nHowever, it's important to note that the strength of peer influence can be moderated by various factors. For instance, Urberg et al. (2003) proposed a two-stage model of peer influence, emphasizing that individual and relationship-specific differences affect susceptibility to peer influence. Their study found that adolescents who did not value school achievement or spending time with parents were more likely to choose friends who smoked cigarettes more than they did. Additionally, high peer acceptance and quality friendships increased the likelihood of adolescents conforming to their friends' substance use behaviors. ([sciencedirect.com](https://www.sciencedirect.com/science/article/abs/pii/S0306460302002563?utm_source=openai))\n\nIn summary, the body of scientific literature supports a positive relationship between the intensity of peer influence and the frequency of substance use. This relationship is influenced by individual characteristics, the nature of peer relationships, and the specific substances involved. "
