                  "text": "Scientific studies have explored the relationship between the frequency of substance use and access to mental health treatment, revealing both positive associations and barriers to care.\n\nA study analyzing data from the 2017\u20132019 National Survey on Drug Use and Health found that individuals with substance use disorders (SUDs) but no mental illness had higher odds of receiving mental health treatment. This suggests that substance use may prompt individuals to seek mental health services, potentially due to the recognition of co-occurring issues or the impact of substance use on mental well-being. ([sciencedirect.com](https://www.sciencedirect.com/science/article/pii/S2590113323000123?utm_source=openai))\n\nConversely, research focusing on rural adults using stimulants over a three-year period identified several barriers to accessing mental health and SUD treatment. Factors such as being male, nonwhite, and having a prior history of treatment were associated with lower odds of utilizing these services. Additionally, individuals with greater legal problems and alcohol severity were more likely to seek treatment, indicating that external pressures and the severity of substance use may influence treatment access. ([pmc.ncbi.nlm.nih.gov](https://pmc.ncbi.nlm.nih.gov/articles/PMC6711827/?utm_source=openai))\n\nThese findings highlight a complex relationship where the frequency and severity of substance use can both facilitate and hinder access to mental health treatment, influenced by demographic factors and external circumstances. "
