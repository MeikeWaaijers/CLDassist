                  "logprobs": [],
                  "text": "Scientific studies have explored the relationship between the frequency of substance use and a family history of addiction, yielding evidence that supports a positive association.\n\nA study published in 2025 examined the impact of Weighted Family History Density (WFHD) on substance use patterns. WFHD quantifies the prevalence of substance use disorders among first- and second-degree relatives. The findings indicated that higher WFHD is associated with earlier initiation, faster escalation to peak use, and prolonged duration of substance use. Specifically, each unit increase in WFHD corresponded to a 0.53-year earlier onset and a 0.48-year longer duration of substance use. Additionally, individuals with higher WFHD exhibited faster escalation to peak substance use levels. ([pmc.ncbi.nlm.nih.gov](https://pmc.ncbi.nlm.nih.gov/articles/PMC12211992/?utm_source=openai))\n\nAnother study investigated the intergenerational transmission of addictive behaviors, focusing on the mediating effects of cross-addiction frequency and problems. The research demonstrated that parental and sibling engagement in gambling and substance use was related to higher frequency and problem severity of these behaviors in participants. Notably, the frequency of gambling and substance use mediated the relationship between family and household addictive behaviors and the severity of participants' gambling, alcohol, and drug use problems. ([sciencedirect.com](https://www.sciencedirect.com/science/article/pii/S030646032200226X?utm_source=openai))\n\nFurthermore, research on the interrelationships among parental family history of substance misuse, delay discounting, and personal substance use found that individuals with a parental history of substance misuse exhibited higher rates of substance use. This suggests that a family history of substance misuse is associated with increased substance use frequency in offspring. ([pubmed.ncbi.nlm.nih.gov](https://pubmed.ncbi.nlm.nih.gov/26395990/?utm_source=openai))\n\nThese studies collectively indicate a positive relationship between the frequency of substance use and a family history of addiction, highlighting the significance of familial influences on substance use behaviors. "
